# Everything the protocol needs, in one command:
#
#   conda env create -f environment.yml
#   conda activate spatchcocking
#
# This installs the scientific stack, the napari viewer, pytest, and this package
# itself (editable, from the `-e .` line at the bottom), so there is no separate
# `pip install` step.
#
# Unlike the original pipeline, this environment needs no git checkouts: the one
# function that required vedo's development branch is vendored in
# src/spatchcocking/_vendor/, so an ordinary released vedo is sufficient.
name: spatchcocking
channels:
  - conda-forge
dependencies:
  # Every version is pinned to the environment the test suite was verified with
  # (2026-10-21), so a reader installs exactly the same stack.
  - python=3.11.16
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.6
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - scikit-image=0.26.0
  - tifffile=2026.3.3
  - trimesh=5.1.0
  - vtk=9.6.2
  - jupytext=1.19.5
  - ipykernel=6.31.0  # runs the notebooks' cells in an editor such as VS Code
  - tqdm=4.70.1
  # The viewer for the input check and for the surface inside the image, with its
  # Qt backend.
  # PySide6 (Qt6), not pyqt: napari 0.9 deprecates PyQt5 and says so in a popup
  # over the canvas every time a viewer opens.
  - napari=0.9.1
  - pyside6=6.11.2
  - pytest=9.1.1
  - pip=26.2.1
  - pip:
      # Pinned to the release the test suite was verified against. Curvature
      # differs very slightly between vedo builds, so a newer one is very likely
      # fine; the pin is for reproducing the numbers exactly.
      - vedo==2026.6.1
      # This package, editable: edits under src/ take effect without reinstalling.
      - -e .
